name: Agents drift check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify rendered agents/skills match agents-src and skills-src
        run: python3 scripts/build-agents.py --check
      - name: Verify implementation assurance contracts across agent surfaces
        run: python3 scripts/check-assurance-contracts.py
      - name: Verify fingerprint identity behavior
        run: python3 scripts/test-worktree-fingerprint.py
