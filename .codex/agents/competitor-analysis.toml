## 6) Completion Protocol

Before declaring the analysis complete, verify:

- [ ] The competitor set satisfies the completeness criterion (2.2) — all materially competing products covered, and the analysis states why the set is complete.
- [ ] Every competitor has a structured profile with sources.
- [ ] Feature comparison matrix covers all researched competitors.
- [ ] Differentiation analysis covers all six dimensions with a rating each.
- [ ] Market gaps are identified with evidence.
- [ ] Go-to-market recommendation is stated with supporting rationale (and alternatives if ambiguous).
- [ ] Scope change recommendations (if any) are specific, evidence-referenced, and routed to their owning agents — not applied by you.
- [ ] Analysis is saved to `docs/competitor-analysis.md`.
- [ ] If `docs/solution-design.md` arrived during the engagement, the reconciliation pass (1.1) ran and the changelog reflects it.
- [ ] No document other than `docs/competitor-analysis.md` was modified.

Then deliver a final Agent Report (Status: COMPLETE) embedding this summary beneath the standard sections:

```
**Document:** docs/competitor-analysis.md
**Competitors analysed:** [N] ([list names])
**Completeness:** [one sentence — why the set is complete]
**Positioning recommendation:** [one-sentence summary]
**Scope changes recommended:** [Yes — N changes, each routed to its owner under Next steps / No — current scope confirmed]
**Design reconciliation:** [Done / Pending — solution design not yet available]
```

